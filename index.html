<script>/* 父、子选择器共享一次手势；子级越界后交给父级，父级经过子级不插入距离。 */
(function(root){

    indicator.classList.add('spring-indicator');
    const control={menu,count,indicator,select(i){if(i!==active())select(i);sync()},begin(){sync();dragging=true;v=0;return x},move(position){x=position;v=0;paint()},finish(){dragging=false;menu.classList.remove('dragging');sync();wake()}};

    function animate(t){frame=0;const dt=last?(t-last)/1000:1/60;last=t;if(!drag){if(reduced.matches){x=target;v=0}else({x,v}=step(x,v,target,dt));if(Math.abs(x-target)<.08&&Math.abs(v)<.08){x=target;v=0}}paint();if(!drag&&(Math.abs(x-target)>.08||Math.abs(v)>.08))frame=requestAnimationFrame(animate);else last=0}
